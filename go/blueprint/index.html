<!DOCTYPE html>
<html lang="en">
<!--
  Bridge page: /go/blueprint/
  Exists only so a checkout click is countable: Cloudflare Web Analytics cannot see clicks
  on an outbound link, but it does see a pageview here.

  The beacon is NOT written here. Cloudflare Pages injects it into every HTML response at
  the edge, and a hand-written one only fights with it, so this page carries no analytics
  tag of its own. It just waits 600ms before redirecting to give that injected beacon time
  to report, since a page that leaves instantly is a page that never gets counted.

  It sits on the conversion path, so the rest is kept cheap: the landing page prefetches
  this document, so the tap costs no round trip, and the connection to Hotmart is already
  open by the time the redirect fires.

  Every incoming query string is forwarded, which is how per-section attribution survives.
  There is only one of these because the site has one checkout destination; the Add-On Pack
  is the order bump inside this same product, not a separate URL.
-->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Redirecting to checkout</title>

  <!-- Open both connections before anything needs them. -->
  <link rel="preconnect" href="https://pay.hotmart.com" crossorigin />
  <link rel="preconnect" href="https://static.cloudflareinsights.com" crossorigin />

  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <!-- Palette inlined rather than pulling styles.css: this is a redirect, and the whole
       point is that it paints the site's ink instantly and never flashes white. -->
  <style>
    html, body {
      margin: 0; height: 100%;
      background: #0A0E1A; color: #9AA3B2;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
    p { margin: 0; font-size: .875rem; letter-spacing: .01em; }
    a { color: #F5F5F2; }
  </style>
</head>

<body>
  <div class="wrap">
    <p>Redirecting&#8230;</p>
  </div>

  <noscript>
    <div class="wrap">
      <p><a href="https://pay.hotmart.com/B106265452I?checkoutMode=10&amp;src=tiktok">Continue to checkout</a></p>
    </div>
  </noscript>

  <script>
    (function () {
      // Base already owns the "?", so everything after it joins with "&".
      var BASE = 'https://pay.hotmart.com/B106265452I?checkoutMode=10&src=tiktok';
      var incoming = window.location.search.replace(/^\?/, '');
      var target = BASE + (incoming ? '&' + incoming : '');

      var went = false;
      function go() {
        if (went) return;
        went = true;
        // replace() so the back button returns to the landing page, not to this hop.
        window.location.replace(target);
      }

      // Hold before leaving, so Cloudflare's automatically injected beacon has time to
      // send the page view. This document exists only to be counted, so redirecting too
      // early defeats the whole point of it.
      //
      // A fixed wait rather than hooking the script's load event: the beacon is injected at
      // the edge, not written here, so there is no tag of ours to listen to. 600ms sits in
      // the middle of the 500-800ms window and is the entire cost of the hop on a decent
      // connection.
      setTimeout(go, 600);
    })();
  </script>
</body>
</html>
