<!DOCTYPE html>
<html lang="en">
<!--
  Bridge page: /go/blueprint/
  Exists only so a checkout click is countable. Cloudflare Web Analytics cannot see clicks
  on an outbound link, but it does see a pageview here, so this stands between the button
  and Hotmart purely to be measured.

  Every incoming query string is forwarded, which is how per-section attribution survives:
  the buttons link here with their own utm_content and it is passed straight through.

  There is only one of these because the site has one checkout destination. The Add-On Pack
  is not a separate URL, it is the order bump that checkoutMode=10 surfaces inside this same
  product, so a /go/bundle/ would point at the exact same place.
-->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Redirecting to checkout</title>

  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.png" sizes="96x96" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Warm up the TLS handshake to Hotmart while the 300ms timer runs, so the hop costs
       the buyer as little as possible. -->
  <link rel="preconnect" href="https://pay.hotmart.com" crossorigin />

  <!-- Palette inlined rather than pulling styles.css: this page is a redirect, and the
       whole point is that it paints the site's ink instantly and never flashes white. -->
  <style>
    html, body {
      margin: 0; height: 100%;
      background: #0A0E1A; color: #9AA3B2;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
    p { margin: 0; font-size: .875rem; letter-spacing: .01em; }
    a { color: #F5F5F2; }
  </style>
</head>

<body>
  <div class="wrap">
    <p>Redirecting…</p>
  </div>

  <noscript>
    <div class="wrap">
      <p><a href="https://pay.hotmart.com/B106265452I?checkoutMode=10&amp;src=tiktok">Continue to checkout</a></p>
    </div>
  </noscript>

  <script>
    (function () {
      // Base already owns the "?", so everything after it joins with "&".
      var BASE = 'https://pay.hotmart.com/B106265452I?checkoutMode=10&src=tiktok';
      var incoming = window.location.search.replace(/^\?/, '');
      var target = BASE + (incoming ? '&' + incoming : '');

      // ~300ms so the beacon has time to fire before the document goes away. replace()
      // rather than href so the back button returns to the landing page, not to this hop.
      setTimeout(function () { window.location.replace(target); }, 300);
    })();
  </script>

  <!-- Cloudflare Web Analytics -->
  <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "REEMPLAZAR_TOKEN"}'></script>
</body>
</html>
